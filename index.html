<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kama Store</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1f1b16;--mu:#7a7167;--ac:#b4532a;--acx:#fff;--bd:#e8e1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#211d17;--tx:#f3ede4;--mu:#a89f93;--ac:#e07b4c;--acx:#17140f;--bd:#352f26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140f;--card:#211d17;--tx:#f3ede4;--mu:#a89f93;--ac:#e07b4c;--acx:#17140f;--bd:#352f26;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.6}
header{padding:40px 20px 24px;text-align:center}
header h1{margin:0;font-size:2rem;font-weight:800}
header p{margin:6px 0 0;color:var(--mu)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 48px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 16px;border-radius:99px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:3rem}
.ph img{width:100%;height:100%;object-fit:cover}
.info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{margin:0;font-size:1rem}
.cat{color:var(--mu);font-size:.8rem}
.price{font-weight:800;color:var(--ac)}
.btn{display:block;text-align:center;border:0;background:var(--ac);color:var(--acx);padding:8px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;margin-top:auto}
.btn.sec{background:transparent;color:var(--mu);border:1px solid var(--bd);margin-top:6px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
#admin{background:var(--card);border:1px dashed var(--ac);border-radius:14px;padding:16px;margin-bottom:24px}
#admin h2{margin:0 0 10px;font-size:1.1rem}
#admin form,#admin .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
#admin input,#admin select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
#admin hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
footer{text-align:center;padding:24px 16px 40px;border-top:1px solid var(--bd);color:var(--mu)}footer:empty{display:none}footer p{margin:0 0 10px}.soc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.soc a{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 16px;border-radius:99px;text-decoration:none}.soc a:hover{background:var(--ac);color:var(--acx);border-color:var(--ac)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 18px;border-radius:99px;display:none}
#auth h2{margin:0 0 10px;font-size:1.1rem}#auth .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}#auth input{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}#bar{align-items:center}#bar button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 16px;border-radius:99px;font:inherit;cursor:pointer}</style>
</head>
<body>
<header><h1 id="sname" dir="auto"></h1><p>ملابس ومنتجات مختارة بعناية</p></header>
<div class="wrap">
    <div id="bar" class="tabs"></div><div id="auth" hidden style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px"></div><div id="admin" hidden></div><div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>
<footer id="foot"></footer>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ======= الصق بيانات مشروع Supabase هنا (Settings > API) ======= */
const SUPABASE_URL = "https://nllurgngmzdlolzvgoln.supabase.co";
const SUPABASE_KEY = "sb_publishable_t_MK1xNm94a4lrjc-O42Cg_QAG0lKuF";
/* ============================================================== */
const CATS = ["رجالي", "حريمي", "أطفال", "إكسسوارات"];
const SOC = { facebook: 'فيسبوك', instagram: 'إنستجرام', tiktok: 'تيك توك', youtube: 'يوتيوب', x: 'X' };
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML.replace(/"/g, '&quot;') };
const toast = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000) };
const normUrl = v => { v = (v || '').trim(); if (!v) return ''; if (!/^https?:\/\//i.test(v)) v = 'https://' + v; try { return new URL(v).href } catch (e) { return '' } };
let me = null, role = 'user', cfg = {}, prods = [], cur = 'الكل';
const isAdmin = () => role === 'admin' || role === 'owner';

async function load() {
  const [s, p] = await Promise.all([
    sb.from('settings').select('*').eq('id', 1).maybeSingle(),
    sb.from('products').select('*').order('created_at', { ascending: false })
  ]);
  cfg = s.data || {}; prods = p.data || [];
  render(); renderBar(); renderAdmin();
}
async function setUser(u) {
  me = u || null; role = 'user';
  if (me) { const { data } = await sb.from('profiles').select('role').eq('id', me.id).maybeSingle(); role = data?.role || 'user' }
  await load();
}

function render() {
  const name = cfg.store_name || 'Kama Store';
  document.title = name; $('sname').textContent = name;
  const cats = ['الكل', ...CATS];
  $('tabs').innerHTML = cats.map(c => `<button class="${c === cur ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { cur = b.dataset.c; render() });
  const list = prods.filter(p => cur === 'الكل' || p.category === cur);
  $('grid').innerHTML = list.length ? list.map(p => {
    const img = p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}">` : '🛍️';
    const msg = encodeURIComponent('أهلاً، عايز أطلب: ' + p.name + ' بسعر ' + p.price + ' ج.م');
    const wa = cfg.whatsapp ? `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(cfg.whatsapp)}?text=${msg}">اطلب على واتساب</a>` : '';
    const del = isAdmin() ? `<button class="btn sec" data-del="${esc(p.id)}">حذف</button>` : '';
    return `<div class="card"><div class="ph">${img}</div><div class="info"><span class="cat">${esc(p.category)}</span><h3>${esc(p.name)}</h3><span class="price">${esc(String(p.price))} ج.م</span>${wa}${del}</div></div>`;
  }).join('') : '<div class="empty">مفيش منتجات في القسم ده لسه</div>';
  $('grid').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('تحذف المنتج؟')) return;
    const { error } = await sb.from('products').delete().eq('id', b.dataset.del);
    error ? toast(error.message) : load();
  });
  const l = Object.entries(SOC).filter(([k]) => cfg[k]).map(([k, n]) => `<a href="${esc(cfg[k])}" target="_blank" rel="noopener">${n}</a>`);
  if (cfg.whatsapp) l.push(`<a href="https://wa.me/${esc(cfg.whatsapp)}" target="_blank" rel="noopener">واتساب</a>`);
  if (cfg.email) l.push(`<a href="mailto:${esc(cfg.email)}">إيميل</a>`);
  $('foot').innerHTML = l.length ? `<p>تابعنا على</p><div class="soc">${l.join('')}</div>` : '';
}

function renderBar() {
  const b = $('bar');
  if (me) {
    b.innerHTML = `<span style="color:var(--mu)">${esc(me.email)} ${role !== 'user' ? '(' + (role === 'owner' ? 'مالك' : 'أدمن') + ')' : ''}</span><button id="lo">خروج</button>`;
    $('lo').onclick = () => sb.auth.signOut();
  } else {
    b.innerHTML = `<button id="li">تسجيل الدخول</button><button id="su">حساب جديد</button>`;
    $('li').onclick = () => authBox('login'); $('su').onclick = () => authBox('signup');
  }
}
function authBox(mode) {
  const a = $('auth'); a.hidden = false;
  a.innerHTML = `<h2>${mode === 'login' ? 'تسجيل الدخول' : 'إنشاء حساب جديد'}</h2><div class="row"><input id="ae" type="email" placeholder="الإيميل" dir="ltr"><input id="ap" type="password" placeholder="الباسورد (6 حروف على الأقل)" dir="ltr"><button class="btn" id="ago" type="button">${mode === 'login' ? 'دخول' : 'إنشاء الحساب'}</button></div>`;
  $('ago').onclick = async () => {
    const creds = { email: $('ae').value.trim(), password: $('ap').value };
    const { error } = mode === 'login' ? await sb.auth.signInWithPassword(creds) : await sb.auth.signUp(creds);
    if (error) return toast(error.message);
    a.hidden = true;
    toast(mode === 'login' ? 'تم الدخول' : 'تم إنشاء الحساب، راجع إيميلك لو طلب تفعيل');
  };
}

async function renderAdmin() {
  const a = $('admin'); a.hidden = !isAdmin();
  if (!isAdmin()) { a.innerHTML = ''; return }
  a.innerHTML = `<h2>لوحة التحكم</h2>
  <form id="f"><input id="fn" placeholder="اسم المنتج" required><input id="fp" type="number" min="0" placeholder="السعر بالجنيه" required><select id="fc">${CATS.map(c => `<option>${c}</option>`).join('')}</select><input id="ff" type="file" accept="image/*"><button class="btn" type="submit">إضافة المنتج</button></form>
  <hr><div class="row"><input id="sn" placeholder="اسم المتجر"><input id="sw" placeholder="واتساب (201xxxxxxxxx)" dir="ltr"><input id="se" placeholder="الإيميل" dir="ltr"></div>
  <div class="row" style="margin-top:8px">${Object.keys(SOC).map(k => `<input id="so_${k}" placeholder="رابط ${SOC[k]}" dir="ltr">`).join('')}</div>
  <button class="btn" id="ss" type="button" style="margin-top:8px">حفظ الإعدادات</button>
  ${role === 'owner' ? '<hr><h2>المستخدمين والأدمنز</h2><div id="users"></div>' : ''}`;
  $('sn').value = cfg.store_name || ''; $('sw').value = cfg.whatsapp || ''; $('se').value = cfg.email || '';
  Object.keys(SOC).forEach(k => $('so_' + k).value = cfg[k] || '');
  $('f').onsubmit = async e => {
    e.preventDefault();
    let image_url = ''; const file = $('ff').files[0];
    if (file) {
      const path = Date.now() + '.' + (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
      const up = await sb.storage.from('products').upload(path, file);
      if (up.error) return toast(up.error.message);
      image_url = sb.storage.from('products').getPublicUrl(path).data.publicUrl;
    }
    const { error } = await sb.from('products').insert({ name: $('fn').value.trim(), price: Number($('fp').value), category: $('fc').value, image_url });
    error ? toast(error.message) : (toast('تمت الإضافة'), load());
  };
  $('ss').onclick = async () => {
    const row = { store_name: $('sn').value.trim(), whatsapp: $('sw').value.replace(/\D/g, ''), email: $('se').value.trim() };
    Object.keys(SOC).forEach(k => row[k] = normUrl($('so_' + k).value));
    const { error } = await sb.from('settings').update(row).eq('id', 1);
    error ? toast(error.message) : (toast('تم الحفظ'), load());
  };
  if (role === 'owner') {
    const { data, error } = await sb.from('profiles').select('*').order('email');
    if (error) return toast(error.message);
    $('users').innerHTML = data.map(u => `<div class="row" style="align-items:center;margin-bottom:6px"><span dir="ltr">${esc(u.email)}</span><span>${u.role === 'owner' ? 'مالك' : u.role === 'admin' ? 'أدمن' : 'مستخدم'}</span>${u.role === 'owner' ? '<span></span>' : `<button class="btn sec" style="margin:0" data-u="${esc(u.id)}" data-r="${u.role === 'admin' ? 'user' : 'admin'}">${u.role === 'admin' ? 'شيل الأدمن' : 'اجعله أدمن'}</button>`}</div>`).join('') || '<div class="empty">لسه محدش سجل</div>';
    $('users').querySelectorAll('[data-u]').forEach(b => b.onclick = async () => {
      const { error } = await sb.from('profiles').update({ role: b.dataset.r }).eq('id', b.dataset.u);
      error ? toast(error.message) : (toast('تم التعديل'), renderAdmin());
    });
  }
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  await setUser(session?.user);
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') sb.auth.getSession().then(r => setUser(r.data.session?.user)) });
})();
</script>
</body>
</html>
