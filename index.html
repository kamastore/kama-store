<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kama Store</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1f1b16;--mu:#7a7167;--ac:#b4532a;--acx:#fff;--bd:#e8e1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#211d17;--tx:#f3ede4;--mu:#a89f93;--ac:#e07b4c;--acx:#17140f;--bd:#352f26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140f;--card:#211d17;--tx:#f3ede4;--mu:#a89f93;--ac:#e07b4c;--acx:#17140f;--bd:#352f26;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.6}
header{padding:40px 20px 24px;text-align:center}
header h1{margin:0;font-size:2rem;font-weight:800}
header p{margin:6px 0 0;color:var(--mu)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 48px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 16px;border-radius:99px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:3rem}
.ph img{width:100%;height:100%;object-fit:cover}
.info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{margin:0;font-size:1rem}
.cat{color:var(--mu);font-size:.8rem}
.price{font-weight:800;color:var(--ac)}
.btn{display:block;text-align:center;border:0;background:var(--ac);color:var(--acx);padding:8px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;margin-top:auto}
.btn.sec{background:transparent;color:var(--mu);border:1px solid var(--bd);margin-top:6px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
#admin{background:var(--card);border:1px dashed var(--ac);border-radius:14px;padding:16px;margin-bottom:24px}
#admin h2{margin:0 0 10px;font-size:1.1rem}
#admin form,#admin .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
#admin input,#admin select,#admin textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
#admin hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
footer{text-align:center;padding:24px 16px 40px;border-top:1px solid var(--bd);color:var(--mu)}footer:empty{display:none}footer p{margin:0 0 10px}.soc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.soc a{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 16px;border-radius:99px;text-decoration:none}.soc a:hover{background:var(--ac);color:var(--acx);border-color:var(--ac)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 18px;border-radius:99px;display:none}
#auth h2{margin:0 0 10px;font-size:1.1rem}#auth .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}#auth input{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}#auth select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}#bar{align-items:center}#bar button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 16px;border-radius:99px;font:inherit;cursor:pointer}#admin h3{margin:10px 0 8px;font-size:1rem}#admin label{display:flex;gap:8px;align-items:center}#admin input[type=color]{width:56px;padding:2px;height:36px}#chat{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;width:min(380px,calc(100vw - 24px));height:440px;background:var(--card);border:1px solid var(--bd);border-radius:14px;display:flex;flex-direction:column;z-index:20;box-shadow:0 8px 30px #0003}#chat[hidden]{display:none}.ch-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bd)}.ch-h button{border:0;background:none;color:var(--tx);font-size:1.1rem;cursor:pointer}.ch-b{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}.msg{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--bd);align-self:flex-start;word-break:break-word}.msg.me{background:var(--ac);color:var(--acx);align-self:flex-end}.ch-f{display:flex;gap:8px;padding:10px;border-top:1px solid var(--bd)}.ch-f input{flex:1;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}</style>
</head>
<body>
<header><h1 id="sname" dir="auto"></h1><p>ملابس ومنتجات مختارة بعناية</p></header>
<div class="wrap">
    <div id="bar" class="tabs"></div><div id="auth" hidden style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px"></div><div id="admin" hidden></div><div id="shops"></div><div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>
<footer id="foot"></footer>
<div id="chat" hidden></div><div id="vis" style="text-align:center;color:var(--mu);padding-bottom:30px"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://nllurgngmzdlolzvgoln.supabase.co", SUPABASE_KEY = "sb_publishable_t_MK1xNm94a4lrjc-O42Cg_QAG0lKuF";
const SOC = { facebook: 'فيسبوك', instagram: 'إنستجرام', tiktok: 'تيك توك', youtube: 'يوتيوب', x: 'X' };
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML.replace(/"/g, '&quot;') };
const toast = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3500) };
const normUrl = v => { v = (v || '').trim(); if (!v) return ''; if (!/^https?:\/\//i.test(v)) v = 'https://' + v; try { return new URL(v).href } catch (e) { return '' } };
const SH = () => (location.hash.match(/^#shop-([0-9a-f-]{36})$/) || [])[1] || null;
let shopId = SH(), me = null, role = 'user', perm = {}, cfg = {}, prods = [], cats = [], cur = 'الكل', bal = 0, shop = {};
const isAdmin = () => role === 'admin' || role === 'owner', isOwner = () => role === 'owner';
const has = k => isOwner() || !!perm[k], hasAny = () => has('can_categories') || has('can_withdrawals') || has('can_resets'), canSeeAny = () => isOwner() || hasAny() || (role === 'admin' && !!perm.can_panel), showPanel = () => isOwner() || (role === 'admin' && (!!perm.can_panel || hasAny()));
const PERMS = [['can_panel', 'لوحة'], ['can_categories', 'أقسام'], ['can_withdrawals', 'سحب'], ['can_resets', 'أكواد'], ['can_chat', 'دردشة']];
const val = id => $(id).value.trim();
async function act(p, ok) { const r = await p; if (r.error) { toast(r.error.message); return false } if (ok) toast(ok); await load(); return true }

async function load() {
  const [s, p, c] = await Promise.all([sb.from('settings').select('*').eq('id', 1).maybeSingle(), sb.from('products').select('id,name,price,category,image_url,seller_id,created_at,description').order('created_at', { ascending: false }), sb.from('categories').select('*').order('sort')]);
  cfg = s.data || {}; prods = p.data || []; cats = c.data || [];
  ownerId = (await sb.rpc('store_owner')).data || null;
  privMap = {}; if (me && canSeeAny()) ((await sb.from('product_private').select('product_id,details')).data || []).forEach(r => privMap[r.product_id] = r.details);
  shopInfo = {}; if (me && canSeeAny()) ((await sb.rpc('shop_info')).data || []).forEach(r => shopInfo[r.seller_id] = r);
  if (me && isAdmin()) {
    const w = await sb.from('wallet_tx').select('amount').eq('user_id', me.id);
    bal = (w.data || []).reduce((a, x) => a + Number(x.amount), 0);
    shop = (await sb.from('profiles').select('shop_name,whatsapp').eq('id', me.id).maybeSingle()).data || {};
  }
  const st = document.documentElement.style;
  if (cfg.primary_color) st.setProperty('--ac', cfg.primary_color);
  if (cfg.bg_color) st.setProperty('--bg', cfg.bg_color);
  render(); renderBar(); await renderAdmin();
}
async function setUser(u) {
  me = u || null; role = 'user'; perm = {};
  if (me) { const pr = (await sb.from('profiles').select('*').eq('id', me.id).maybeSingle()).data || {}; role = pr.role || 'user'; perm = pr }
  await load();
}

function catShops() {
  const m = {};
  prods.filter(p => p.category === cur && p.seller_id).forEach(p => { const x = m[p.seller_id] || (m[p.seller_id] = { n: p.shop_name || 'محل', c: 0 }); x.c++ });
  const e = Object.entries(m);
  return `<h2 style="text-align:center;margin:0 0 12px">محلات ${esc(cur)}</h2>` + (e.length ? `<div class="grid" style="margin-bottom:20px">${e.map(([id, x]) => `<a class="card" href="#shop-${esc(id)}" style="text-decoration:none;color:inherit"><div class="ph" style="aspect-ratio:3/1;font-size:2rem">🏬</div><div class="info"><h3>${esc(x.n)}</h3><span class="cat">${x.c} منتج في ${esc(cur)}</span></div></a>`).join('')}</div>` : '<div class="empty">مفيش محلات في القسم ده لسه</div>');
}
function render() {
  if (!canSeeAny()) shopId = null;
  const name = cfg.store_name || 'Kama Store';
  document.title = name; $('sname').textContent = name;
  const names = ['الكل', ...cats.map(c => c.name)];
  $('tabs').innerHTML = names.map(c => `<button class="${c === cur ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { cur = b.dataset.c; render() });
  const inCat = false;
  const shops = {}; Object.entries(shopInfo).forEach(([id, r]) => { if (r.shop_name) shops[id] = r.shop_name });
  $('shops').innerHTML = shopId
    ? `<div style="text-align:center;margin-bottom:14px"><h2 style="margin:0">${esc(shops[shopId] || 'محل')}</h2><a href="#" style="color:var(--ac)">← ${cur === 'الكل' ? 'كل المحلات' : 'محلات ' + esc(cur)}</a> · <a href="#shop-${shopId}" style="color:var(--ac)" onclick="navigator.clipboard.writeText(location.origin+location.pathname+'#shop-${shopId}');toast('تم نسخ رابط المحل')">نسخ رابط المحل</a></div>`
    : inCat ? catShops() : (Object.keys(shops).length ? `<p style="text-align:center;color:var(--mu);margin:0 0 6px">المحلات</p><div class="soc" style="margin-bottom:14px">${Object.entries(shops).map(([id, n]) => `<a href="#shop-${esc(id)}">${esc(n)}</a>`).join('')}</div>` : '');
  const list = inCat ? [] : prods.filter(p => (!shopId || p.seller_id === shopId) && (cur === 'الكل' || p.category === cur));
  $('grid').innerHTML = list.length ? list.map(p => {
    const img = p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}">` : '🛍️';
    const inf = shopInfo[p.seller_id] || {}, see = me && (isOwner() || hasAny() || p.seller_id === me.id), wa = see ? inf.whatsapp : cfg.whatsapp;
    const msg = encodeURIComponent('أهلاً، عايز أسأل عن: ' + p.name + ' (' + p.price + ' ج.م)');
    const btn = wa ? `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(wa)}?text=${msg}">${see ? 'تواصل مع المحل' : 'تواصل مع المتجر'}</a>` : '';
    const cb = ownerId && !(me && (isOwner() || has('can_chat'))) ? `<button class="btn sec" data-chat="${esc(ownerId)}" data-t="${esc('المتجر · ' + p.name)}">دردشة مع المتجر</button>` : '';
    const priv = see && privMap[p.id] !== undefined ? `<details style="margin-top:6px"><summary>تفاصيل خاصة</summary><div style="white-space:pre-wrap;font-size:.85rem;color:var(--mu)">${esc(privMap[p.id])}</div></details>` : '';
    const pe = me && (isOwner() || p.seller_id === me.id) && has('can_panel') ? `<button class="btn sec" data-pe="${esc(p.id)}">${privMap[p.id] ? 'تعديل' : 'إضافة'} التفاصيل الخاصة</button>` : '';
    const pd = me && (isOwner() || p.seller_id === me.id) && has('can_panel') ? `<button class="btn sec" data-pd="${esc(p.id)}">تعديل الوصف</button>` : '';
    const del = me && (isOwner() || p.seller_id === me.id) ? `<button class="btn sec" data-del="${esc(p.id)}">حذف</button>` : '';
    return `<div class="card"><div class="ph">${img}</div><div class="info"><span class="cat">${esc(p.category)}</span><h3>${esc(p.name)}</h3>${p.description ? '<p style="margin:0;color:var(--mu);font-size:.85rem">' + esc(p.description) + '</p>' : ''}<span class="price">${esc(String(p.price))} ج.م</span>${see ? '<span class="cat">🏬 <a href="#shop-' + esc(p.seller_id) + '" style="color:inherit">' + esc(inf.shop_name || cfg.store_name || 'Kama Store') + '</a></span>' : ''}${btn}${cb}${priv}${pd}${pe}${del}</div></div>`;
  }).join('') : (inCat ? '' : '<div class="empty">مفيش منتجات في القسم ده لسه</div>');
  $('grid').querySelectorAll('[data-chat]').forEach(b => b.onclick = () => me ? openChat(b.dataset.chat, me.id, b.dataset.t) : toast('سجّل دخول الأول علشان تبدأ دردشة'));
  $('grid').querySelectorAll('[data-pe]').forEach(b => b.onclick = () => { const t = prompt('التفاصيل الخاصة (للأدمن بس)', privMap[b.dataset.pe] || ''); if (t !== null) act(sb.rpc('set_private', { p_id: b.dataset.pe, p_details: t }), 'تم الحفظ') });
  $('grid').querySelectorAll('[data-pd]').forEach(b => b.onclick = () => { const cur0 = (prods.find(x => x.id === b.dataset.pd) || {}).description || ''; const t = prompt('وصف بسيط يظهر للزبون (200 حرف بحد أقصى)', cur0); if (t !== null) act(sb.from('products').update({ description: t.trim().slice(0, 200) }).eq('id', b.dataset.pd), 'تم حفظ الوصف') });
  $('grid').querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirm('تحذف المنتج؟') && act(sb.from('products').delete().eq('id', b.dataset.del)));
  const l = Object.entries(SOC).filter(([k]) => cfg[k]).map(([k, n]) => `<a href="${esc(cfg[k])}" target="_blank" rel="noopener">${n}</a>`);
  if (cfg.whatsapp) l.push(`<a href="https://wa.me/${esc(cfg.whatsapp)}" target="_blank" rel="noopener">واتساب</a>`);
  if (cfg.email) l.push(`<a href="mailto:${esc(cfg.email)}">إيميل</a>`);
  $('foot').innerHTML = l.length ? `<p>تابعنا على</p><div class="soc">${l.join('')}</div>` : '';
}

function renderBar() {
  const b = $('bar');
  if (me) { b.innerHTML = `<span style="color:var(--mu)">${esc(me.email)} ${role !== 'user' ? '(' + (isOwner() ? 'مالك' : 'أدمن') + ')' : ''}</span>${role === 'user' || has('can_chat') ? '<button id="inb">رسائلي</button>' : ''}<button id="lo">خروج</button>`; $('lo').onclick = () => sb.auth.signOut(); if ($('inb')) $('inb').onclick = openInbox }
  else { b.innerHTML = `<button id="li">تسجيل الدخول</button><button id="su">حساب جديد</button>`; $('li').onclick = () => authBox('login'); $('su').onclick = () => authBox('signup') }
}
let chatKey = null, chatTimer = null, ownerId = null, privMap = {}, shopInfo = {};
function openChat(shop, buyer, title) {
  clearInterval(chatTimer); chatKey = { shop, buyer, title }; const c = $('chat'); c.hidden = false;
  c.innerHTML = `<div class="ch-h"><b>${esc(title)}</b><button id="chx">✕</button></div><div class="ch-b" id="chb"></div><div class="ch-f"><input id="chi" placeholder="اكتب رسالتك..."><button class="btn" id="chs" type="button" style="margin:0;width:auto;padding:8px 14px">إرسال</button></div>`;
  $('chx').onclick = closeChat; $('chs').onclick = sendChat; $('chi').onkeydown = e => { if (e.key === 'Enter') sendChat() };
  pollChat(); chatTimer = setInterval(pollChat, 5000);
}
function closeChat() { clearInterval(chatTimer); $('chat').hidden = true; chatKey = null }
async function pollChat() {
  if (!chatKey || !me) return;
  const { data } = await sb.from('messages').select('*').eq('shop_id', chatKey.shop).eq('buyer_id', chatKey.buyer).order('created_at');
  const b = $('chb'); if (!b) return;
  const bottom = b.scrollHeight - b.scrollTop - b.clientHeight < 40;
  b.innerHTML = (data || []).map(m => `<div class="msg ${(me.id === chatKey.buyer ? m.sender_id === me.id : m.sender_id !== chatKey.buyer) ? 'me' : ''}">${esc(m.body)}</div>`).join('') || '<div class="empty">ابدأ المحادثة</div>';
  if (bottom || !b.dataset.s) { b.scrollTop = b.scrollHeight; b.dataset.s = 1 }
}
async function sendChat() {
  const i = $('chi'), body = i.value.trim(); if (!body || !chatKey) return;
  i.value = '';
  const { error } = await sb.from('messages').insert({ shop_id: chatKey.shop, buyer_id: chatKey.buyer, sender_id: me.id, product_name: chatKey.title, body });
  error ? toast(error.message) : pollChat();
}
async function openInbox() {
  const { data, error } = await sb.from('messages').select('shop_id,buyer_id,body,created_at').order('created_at', { ascending: false }).limit(300);
  if (error) return toast(error.message);
  const seen = {}; (data || []).forEach(m => { const k = m.shop_id + '|' + m.buyer_id; if (!seen[k]) seen[k] = m });
  const names = {}; prods.forEach(p => { if (p.seller_id) names[p.seller_id] = p.shop_name || 'محل' });
  clearInterval(chatTimer); chatKey = null; const c = $('chat'); c.hidden = false;
  c.innerHTML = `<div class="ch-h"><b>رسائلي</b><button id="chx">✕</button></div><div class="ch-b">${Object.values(seen).map(m => { const t = me.id === m.buyer_id ? 'المتجر' : 'زبون ' + m.buyer_id.slice(0, 4); return `<a href="#" class="msg" data-s="${esc(m.shop_id)}" data-b="${esc(m.buyer_id)}" data-t="${esc(t)}" style="display:block;max-width:100%;align-self:stretch;text-decoration:none;color:inherit"><b>${esc(t)}</b><br><small>${esc(m.body.slice(0, 40))}</small></a>` }).join('') || '<div class="empty">مفيش رسائل لسه</div>'}</div>`;
  $('chx').onclick = closeChat;
  c.querySelectorAll('[data-s]').forEach(a => a.onclick = e => { e.preventDefault(); openChat(a.dataset.s, a.dataset.b, a.dataset.t) });
}
(async () => {
  let isNew = true; try { isNew = !sessionStorage.getItem('v'); sessionStorage.setItem('v', '1') } catch (e) { }
  const { data } = await sb.rpc('track_visit', { p_new: isNew });
  if (data != null) $('vis').textContent = 'عدد الزيارات: ' + Number(data).toLocaleString('ar-EG');
})();
let resetEmail = '';
const who = () => val('ae') || val('aph2').replace(/\s/g, '');
const GOVS = ['القاهرة','الجيزة','الإسكندرية','القليوبية','الشرقية','الدقهلية','البحيرة','الغربية','المنوفية','كفر الشيخ','دمياط','بورسعيد','الإسماعيلية','السويس','شمال سيناء','جنوب سيناء','الفيوم','بني سويف','المنيا','أسيوط','سوهاج','قنا','الأقصر','أسوان','البحر الأحمر','الوادي الجديد','مطروح'];
function authBox(mode) {
  const a = $('auth'); a.hidden = false;
  const em = `<input id="ae" type="email" placeholder="الإيميل" dir="ltr">`;
  const pw = `<input id="ap" type="password" placeholder="الباسورد (6 حروف على الأقل)" dir="ltr">`;
  const t = { login: 'تسجيل الدخول', signup: 'إنشاء حساب جديد', forgot: 'استعادة بالإيميل', forgotw: 'نسيت الباسورد', mycode: 'كود الاستعادة من المالك', code: 'كود الاستعادة', newpw: 'باسورد جديد' }[mode];
  let f = '', go = 'دخول';
  if (mode === 'login') f = em + pw + '<a href="#" id="fg" style="color:var(--ac)">نسيت الباسورد؟</a>';
  if (mode === 'signup') { f = em + pw + `<input id="aph" type="tel" placeholder="رقم الموبايل 01xxxxxxxxx" dir="ltr"><select id="ag"><option value="">المحافظة</option>${GOVS.map(g => `<option>${g}</option>`).join('')}</select><input id="aa" placeholder="المنطقة">`; go = 'إنشاء الحساب' }
  if (mode === 'forgotw') { f = `<input id="ae" type="email" placeholder="الإيميل" dir="ltr"><input id="aph2" type="tel" placeholder="رقم الموبايل (اكتب إيميلك أو رقمك أو الاتنين)" dir="ltr">`; go = 'ابعت الطلب على واتساب' }
  if (mode === 'mycode') { f = `<input id="ae" type="email" placeholder="الإيميل" dir="ltr"><input id="aph2" type="tel" placeholder="رقم الموبايل (اكتب إيميلك أو رقمك أو الاتنين)" dir="ltr"><input id="ac" placeholder="الكود اللي بعتهولك المالك" dir="ltr">` + pw.replace('الباسورد', 'الباسورد الجديد'); go = 'تغيير الباسورد' }
  if (mode === 'forgot') { f = em + `<input id="aph2" type="tel" placeholder="أو رقم موبايلك (لو مش قادر تفتح الإيميل)" dir="ltr">`; go = 'ابعت كود الاستعادة على الإيميل' }
  if (mode === 'code') { f = `<input id="ac" placeholder="الكود اللي وصلك على الإيميل" dir="ltr">` + pw.replace('الباسورد', 'الباسورد الجديد'); go = 'تغيير الباسورد' }
  if (mode === 'newpw') { f = pw.replace('الباسورد', 'الباسورد الجديد'); go = 'حفظ الباسورد الجديد' }
  a.innerHTML = `<h2>${t}</h2><div class="row">${f}<button class="btn" id="ago" type="button">${go}</button>${mode === 'forgot' ? '<button class="btn sec" id="wa2" type="button" style="margin:0">ابعت طلب استعادة على واتساب</button>' : ''}${mode === 'forgotw' ? '<button class="btn sec" id="hc" type="button" style="margin:0">عندي كود جاهز</button><a href="#" id="fe" style="color:var(--ac)">أو استعادة بالإيميل</a>' : ''}</div>`;
  if ($('hc')) $('hc').onclick = () => authBox('mycode');
  if ($('fe')) $('fe').onclick = e => { e.preventDefault(); authBox('forgot') };
  if ($('wa2')) $('wa2').onclick = () => {
    const ph = val('aph2').replace(/\D/g, '');
    if (!val('ae') && !/^01\d{9}$/.test(ph)) return toast('اكتب إيميلك أو رقم موبايلك');
    if (!cfg.whatsapp) return toast('رقم الدعم غير متاح حالياً');
    window.open('https://wa.me/' + cfg.whatsapp + '?text=' + encodeURIComponent('نسيت الباسورد.\nالإيميل: ' + val('ae') + '\nالموبايل: ' + ph), '_blank');
  };
  if ($('fg')) $('fg').onclick = e => { e.preventDefault(); authBox('forgotw') };
  $('ago').onclick = async () => {
    let r = {};
    if (mode === 'forgotw') {
      if (!who()) return toast('اكتب إيميلك أو رقم موبايلك');
      if (!cfg.whatsapp) return toast('رقم الدعم غير متاح حالياً');
      window.open('https://wa.me/' + cfg.whatsapp + '?text=' + encodeURIComponent('نسيت الباسورد.\nالإيميل: ' + val('ae') + '\nالموبايل: ' + val('aph2')), '_blank');
      return authBox('mycode');
    }
    if (mode === 'mycode') {
      const { data, error } = await sb.rpc('reset_with_code', { p_who: who(), p_code: val('ac'), p_new: $('ap').value });
      if (error) return toast(error.message);
      if (data !== 'ok') return toast(data);
      toast('تم تغيير الباسورد، سجّل دخول بيه'); return authBox('login');
    }
    if (mode === 'login') r = await sb.auth.signInWithPassword({ email: val('ae'), password: $('ap').value });
    if (mode === 'signup') {
      const ph = val('aph').replace(/\s/g, '');
      if (!/^01\d{9}$/.test(ph)) return toast('اكتب رقم موبايل مصري صحيح (11 رقم)');
      if (!$('ag').value || !val('aa')) return toast('اختار المحافظة واكتب المنطقة');
      r = await sb.auth.signUp({ email: val('ae'), password: $('ap').value, options: { data: { phone: ph, governorate: $('ag').value, area: val('aa') } } });
    }
    if (mode === 'forgot') { r = await sb.auth.resetPasswordForEmail(val('ae'), { redirectTo: location.origin + location.pathname }); if (!r.error) { resetEmail = val('ae'); toast('اتبعتلك كود على الإيميل'); return authBox('code') } }
    if (mode === 'code') { r = await sb.auth.verifyOtp({ email: resetEmail, token: val('ac'), type: 'recovery' }); if (!r.error) r = await sb.auth.updateUser({ password: $('ap').value }) }
    if (mode === 'newpw') r = await sb.auth.updateUser({ password: $('ap').value });
    if (r.error) return toast(r.error.message);
    a.hidden = true; toast('تم');
  };
}

async function renderAdmin() {
  const a = $('admin'); a.hidden = !showPanel();
  if (!showPanel()) { a.innerHTML = ''; return }
  const shopHtml = `
  <div class="row"><b>رصيدك: ${bal} ج.م</b><span>رسوم نشر المنتج: ${cfg.listing_fee ?? 0} ج.م</span></div>
  ${cfg.pay_number ? `<div class="row" style="margin-top:8px;align-items:center"><span>لشحن رصيدك حوّل على: <b dir="ltr">${esc(cfg.pay_number)}</b> ${esc(cfg.pay_info)}</span><button class="btn sec" style="margin:0" type="button" onclick="navigator.clipboard.writeText('${esc(cfg.pay_number)}');toast('تم نسخ الرقم')">نسخ الرقم</button><a class="btn" style="margin:0" target="_blank" rel="noopener" href="https://wa.me/${esc(cfg.whatsapp)}?text=${encodeURIComponent('حولت مبلغ لشحن رصيد محلي: ' + (shop.shop_name || me.email))}">ابعت إثبات التحويل</a></div>` : ''}
  <hr><h3>بيانات محلك (بتظهر على منتجاتك)</h3>
  <div class="row"><input id="shn" placeholder="اسم المحل" value="${esc(shop.shop_name)}"><input id="shw" placeholder="واتساب المحل 201xxxxxxxxx" dir="ltr" value="${esc(shop.whatsapp)}"><button class="btn" data-a="shop" type="button">حفظ</button></div>
  <div class="row" style="margin-top:8px"><a class="btn sec" style="margin:0" href="#shop-${me.id}">فتح صفحة محلي</a><button class="btn sec" style="margin:0" type="button" onclick="navigator.clipboard.writeText(location.origin+location.pathname+'#shop-${me.id}');toast('تم نسخ رابط محلك')">نسخ رابط محلي</button></div>
  <hr><h3>إضافة منتج</h3>
  <form id="f"><input id="fn" placeholder="اسم المنتج" required><input id="fp" type="number" min="0" placeholder="السعر" required><select id="fc">${cats.map(c => `<option>${esc(c.name)}</option>`).join('')}</select><input id="fs" maxlength="200" placeholder="وصف بسيط للمنتج (بيظهر للزبون)" style="grid-column:1/-1"><textarea id="fd" rows="4" placeholder="تفاصيل خاصة (تظهر للأدمن بس، مش للزباين)" style="grid-column:1/-1"></textarea><input id="ff" type="file" accept="image/*"><button class="btn" type="submit">نشر المنتج</button></form>
  <details style="margin-top:10px"><summary style="cursor:pointer">استيراد منتجات كتير من ملف CSV</summary><p style="color:var(--mu);margin:8px 0">الأعمدة بالترتيب: الاسم، السعر، القسم (مطابق لاسم قسم موجود)، رابط الصورة (اختياري). الرسوم بتتخصم على كل منتج.</p><input id="csv" type="file" accept=".csv"><button class="btn" data-a="csv" type="button" style="margin-top:8px">استيراد</button></details>
  <hr><h3>سحب الرصيد</h3>
  <div class="row"><input id="wa" type="number" min="1" placeholder="المبلغ"><select id="wm"><option>إنستا باي</option><option>فودافون كاش</option><option>محفظة إلكترونية أخرى</option></select><input id="wn" placeholder="رقم الحساب أو المحفظة" dir="ltr"><button class="btn" data-a="wd" type="button">طلب سحب</button></div>`;
  a.innerHTML = '<h2>لوحة التحكم</h2>' + (has('can_panel') ? shopHtml : '') + (hasAny() ? '<div id="own"></div>' : '');
  if ($('f')) $('f').onsubmit = async e => {
    e.preventDefault(); let img = ''; const file = $('ff').files[0];
    if (file) {
      const path = Date.now() + '.' + (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
      const up = await sb.storage.from('products').upload(path, file);
      if (up.error) return toast(up.error.message);
      img = sb.storage.from('products').getPublicUrl(path).data.publicUrl;
    }
    act(sb.rpc('publish_product', { p_name: val('fn'), p_price: Number(val('fp')), p_cat: $('fc').value, p_img: img, p_private: val('fd'), p_desc: val('fs') }), 'تم نشر المنتج');
  };
  if (hasAny()) renderOwner();
}

async function renderOwner() {
  const [u, w, t] = await Promise.all([sb.from('profiles').select('*').order('email'), sb.from('withdrawals').select('*').eq('status', 'pending').order('created_at'), sb.from('wallet_tx').select('amount').eq('kind', 'listing_fee')]);
  const comm = -(t.data || []).reduce((s, x) => s + Number(x.amount), 0);
  const full = `<hr><h2>أدوات المالك</h2><p><b>إجمالي عمولاتك: ${comm} ج.م</b></p>
  <h3>الشكل والإعدادات</h3>
  <div class="row"><input id="cn" placeholder="اسم المتجر" value="${esc(cfg.store_name)}"><input id="cw" placeholder="واتساب المتجر" dir="ltr" value="${esc(cfg.whatsapp)}"><input id="ce" placeholder="الإيميل" dir="ltr" value="${esc(cfg.email)}"><input id="cf" type="number" min="0" placeholder="رسوم نشر المنتج" value="${cfg.listing_fee ?? 0}"><input id="pn" placeholder="رقم استلام التحويلات (إنستا باي / فودافون كاش)" dir="ltr" value="${esc(cfg.pay_number)}"><input id="pi" placeholder="تعليمات التحويل (مثال: إنستا باي باسم ...)" value="${esc(cfg.pay_info)}"></div>
  <div class="row" style="margin-top:8px"><label>اللون الأساسي <input id="cp" type="color" value="${cfg.primary_color || '#b4532a'}"></label><label>لون الخلفية <input id="cb" type="color" value="${cfg.bg_color || '#faf7f2'}"></label></div>
  <div class="row" style="margin-top:8px">${Object.keys(SOC).map(k => `<input id="so_${k}" placeholder="رابط ${SOC[k]}" dir="ltr" value="${esc(cfg[k])}">`).join('')}</div>
  <button class="btn" data-a="cfg" type="button" style="margin-top:8px">حفظ الإعدادات</button>
  <hr><h3>الأقسام</h3><div class="row">${cats.map(c => `<button class="btn sec" style="margin:0" data-a="catdel" data-id="${esc(c.id)}">${esc(c.name)} ✕</button>`).join('')}</div>
  <div class="row" style="margin-top:8px"><input id="nc" placeholder="اسم قسم جديد"><button class="btn" data-a="catadd" type="button">إضافة قسم</button></div>
  <hr><h3>شحن رصيد محل (بعد ما يدفعلك)</h3>
  <div class="row"><input id="ke" placeholder="إيميل المحل" dir="ltr"><input id="ka" type="number" placeholder="المبلغ"><button class="btn" data-a="credit" type="button">شحن</button></div>
  <hr><h3>كود استعادة باسورد لمستخدم</h3>
  <div class="row"><input id="rw" placeholder="إيميل أو موبايل المستخدم" dir="ltr"><button class="btn" data-a="mkcode" type="button">طلّع كود</button></div><div id="rcres" style="margin-top:8px"></div>
  <hr><h3>طلبات السحب المعلقة</h3>
  ${(w.data || []).map(x => `<div class="row" style="align-items:center;margin-bottom:6px"><span dir="ltr">${esc(x.email)}</span><span>${x.amount} ج.م · ${esc(x.method)} · <span dir="ltr">${esc(x.account)}</span></span><span><button class="btn" style="display:inline-block;margin:0 4px" data-a="wdok" data-id="${esc(x.id)}">تم التحويل</button><button class="btn sec" style="display:inline-block;margin:0" data-a="wdno" data-id="${esc(x.id)}">رفض</button></span></div>`).join('') || '<div class="empty">لا يوجد</div>'}
  <hr><h3>المستخدمين والأدمنز</h3>
  ${(u.data || []).map(x => `<div class="row" style="align-items:center;margin-bottom:6px"><span><span dir="ltr">${esc(x.email)}</span><br><small style="color:var(--mu)">${esc(x.phone)} · ${esc(x.governorate)} · ${esc(x.area)}${x.shop_name ? ' · محل: ' + esc(x.shop_name) : ''}</small>${x.role === 'owner' ? '' : '<br>' + PERMS.map(([k, n]) => `<button class="btn sec" style="display:inline-block;margin:4px 4px 0 0;padding:2px 10px;font-size:.8rem${x[k] ? ';background:var(--ac);color:var(--acx)' : ''}" data-a="perm" data-id="${esc(x.id)}" data-k="${k}" data-v="${!x[k]}">${n}</button>`).join('')}</span><span>${x.role === 'owner' ? 'مالك' : x.role === 'admin' ? 'أدمن (محل)' : 'مستخدم'}</span>${x.role === 'owner' ? '<span></span>' : `<button class="btn sec" style="margin:0" data-a="role" data-id="${esc(x.id)}" data-r="${x.role === 'admin' ? 'user' : 'admin'}">${x.role === 'admin' ? 'شيل الأدمن' : 'اجعله أدمن'}</button>`}</div>`).join('')}`;
  const ok = [0, isOwner(), has('can_categories'), isOwner(), has('can_resets'), has('can_withdrawals'), isOwner()];
  const parts = full.split('<hr>');
  $('own').innerHTML = (isOwner() ? '' : '<hr><h2>أدوات الموظف</h2>') + parts.filter((p, i) => i > 0 && ok[i]).map(p => '<hr>' + p).join('');
}

async function importCsv() {
  const f = $('csv').files[0]; if (!f) return toast('اختار ملف CSV الأول');
  let rows = (await f.text()).replace(/^\uFEFF/, '').split(/\r?\n/).map(l => l.split(',').map(x => x.trim().replace(/^"|"$/g, ''))).filter(r => r[0]);
  if (rows.length && /^(name|الاسم)/i.test(rows[0][0])) rows.shift();
  const names = cats.map(c => c.name);
  const ok = rows.filter(r => Number(r[1]) >= 0 && r[1] !== '' && names.includes(r[2])).slice(0, 200);
  if (!ok.length) return toast('مفيش صفوف صالحة، راجع الأعمدة وأسماء الأقسام');
  const fee = Number(cfg.listing_fee || 0);
  if (!isOwner() && bal < fee * ok.length) return toast('الرصيد مش كافي، المطلوب ' + fee * ok.length + ' ج.م');
  if (!confirm('هتنشر ' + ok.length + ' منتج (تم تجاهل ' + (rows.length - ok.length) + ' صف غير صالح). تكمل؟')) return;
  let n = 0;
  for (const r of ok) {
    const img = /^https?:\/\//i.test(r[3] || '') ? r[3] : '';
    const { error } = await sb.rpc('publish_product', { p_name: r[0], p_price: Number(r[1]), p_cat: r[2], p_img: img, p_desc: (r[4] || '').slice(0, 200) });
    if (error) { toast(error.message); break } n++;
  }
  toast('تم نشر ' + n + ' منتج'); load();
}
$('admin').onclick = e => {
  const b = e.target.closest('[data-a]'); if (!b) return; const d = b.dataset;
  if (d.a === 'shop') act(sb.rpc('set_shop', { p_name: val('shn'), p_wa: val('shw') }), 'تم الحفظ');
  if (d.a === 'wd') act(sb.rpc('request_withdraw', { p_amount: Number(val('wa')), p_method: $('wm').value, p_account: val('wn') }), 'تم إرسال طلب السحب');
  if (d.a === 'cfg') { const row = { store_name: val('cn'), whatsapp: val('cw').replace(/\D/g, ''), email: val('ce'), listing_fee: Number(val('cf')), pay_number: val('pn').replace(/[^\d+]/g, ''), pay_info: val('pi'), primary_color: $('cp').value, bg_color: $('cb').value }; Object.keys(SOC).forEach(k => row[k] = normUrl(val('so_' + k))); act(sb.from('settings').update(row).eq('id', 1), 'تم الحفظ') }
  if (d.a === 'catadd' && val('nc')) act(sb.from('categories').insert({ name: val('nc'), sort: cats.length + 1 }), 'تمت الإضافة');
  if (d.a === 'catdel' && confirm('تحذف القسم؟')) act(sb.from('categories').delete().eq('id', d.id));
  if (d.a === 'credit') act(sb.rpc('owner_credit', { p_email: val('ke'), p_amount: Number(val('ka')), p_note: 'شحن رصيد' }), 'تم الشحن');
  if (d.a === 'wdok') act(sb.rpc('mark_withdrawal', { p_id: d.id, p_status: 'paid' }), 'تم');
  if (d.a === 'wdno') act(sb.rpc('mark_withdrawal', { p_id: d.id, p_status: 'rejected' }), 'تم الرفض ورجوع الرصيد');
  if (d.a === 'csv') importCsv();
  if (d.a === 'perm') act(sb.from('profiles').update({ [d.k]: d.v === 'true' }).eq('id', d.id), 'تم تعديل الصلاحية');
  if (d.a === 'mkcode') (async () => {
    const { data, error } = await sb.rpc('owner_make_reset_code', { p_who: val('rw') });
    if (error) return toast(error.message);
    const x = data[0];
    const wa = x.phone ? 'https://wa.me/20' + x.phone.slice(1) + '?text=' + encodeURIComponent('كود استعادة الباسورد: ' + x.code + ' (صالح 30 دقيقة)') : '';
    $('rcres').innerHTML = `<b dir="ltr" style="font-size:1.3rem">${esc(x.code)}</b> ← ${esc(x.email)} ${wa ? `<a class="btn" style="display:inline-block;margin:0 8px" target="_blank" rel="noopener" href="${wa}">ابعته على واتساب</a>` : '(مفيش موبايل مسجل، ابعته بنفسك)'}`;
  })();
  if (d.a === 'role') act(sb.from('profiles').update({ role: d.r }).eq('id', d.id), 'تم التعديل');
};

window.onhashchange = () => { shopId = SH(); render(); window.scrollTo(0, 0) };
(async () => {
  const { data: { session } } = await sb.auth.getSession(); await setUser(session?.user);
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') authBox('newpw'); if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') sb.auth.getSession().then(r => setUser(r.data.session?.user)) });
})();
</script>
