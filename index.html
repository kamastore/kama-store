<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kama Store</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1f1b16;--mu:#7a7167;--ac:#b4532a;--acx:#fff;--bd:#e8e1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--card:#211d17;--tx:#f3ede4;--mu:#a89f93;--ac:#e07b4c;--acx:#17140f;--bd:#352f26;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140f;--card:#211d17;--tx:#f3ede4;--mu:#a89f93;--ac:#e07b4c;--acx:#17140f;--bd:#352f26;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.6}
header{padding:40px 20px 24px;text-align:center}
header h1{margin:0;font-size:2rem;font-weight:800}
header p{margin:6px 0 0;color:var(--mu)}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px 48px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.tabs button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 16px;border-radius:99px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:3rem}
.ph img{width:100%;height:100%;object-fit:cover}
.info{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.info h3{margin:0;font-size:1rem}
.cat{color:var(--mu);font-size:.8rem}
.price{font-weight:800;color:var(--ac)}
.btn{display:block;text-align:center;border:0;background:var(--ac);color:var(--acx);padding:8px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;margin-top:auto}
.btn.sec{background:transparent;color:var(--mu);border:1px solid var(--bd);margin-top:6px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
#admin{background:var(--card);border:1px dashed var(--ac);border-radius:14px;padding:16px;margin-bottom:24px}
#admin h2{margin:0 0 10px;font-size:1.1rem}
#admin form,#admin .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
#admin input,#admin select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
#admin hr{border:0;border-top:1px solid var(--bd);margin:14px 0}
footer{text-align:center;padding:24px 16px 40px;border-top:1px solid var(--bd);color:var(--mu)}footer:empty{display:none}footer p{margin:0 0 10px}.soc{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.soc a{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 16px;border-radius:99px;text-decoration:none}.soc a:hover{background:var(--ac);color:var(--acx);border-color:var(--ac)}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 18px;border-radius:99px;display:none}
#auth h2{margin:0 0 10px;font-size:1.1rem}#auth .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}#auth input{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}#bar{align-items:center}#bar button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 16px;border-radius:99px;font:inherit;cursor:pointer}#admin h3{margin:10px 0 8px;font-size:1rem}#admin label{display:flex;gap:8px;align-items:center}#admin input[type=color]{width:56px;padding:2px;height:36px}</style>
</head>
<body>
<header><h1 id="sname" dir="auto"></h1><p>ملابس ومنتجات مختارة بعناية</p></header>
<div class="wrap">
    <div id="bar" class="tabs"></div><div id="auth" hidden style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:16px"></div><div id="admin" hidden></div><div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>
<footer id="foot"></footer>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://nllurgngmzdlolzvgoln.supabase.co", SUPABASE_KEY = "sb_publishable_t_MK1xNm94a4lrjc-O42Cg_QAG0lKuF";
const SOC = { facebook: 'فيسبوك', instagram: 'إنستجرام', tiktok: 'تيك توك', youtube: 'يوتيوب', x: 'X' };
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML.replace(/"/g, '&quot;') };
const toast = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3500) };
const normUrl = v => { v = (v || '').trim(); if (!v) return ''; if (!/^https?:\/\//i.test(v)) v = 'https://' + v; try { return new URL(v).href } catch (e) { return '' } };
let me = null, role = 'user', cfg = {}, prods = [], cats = [], cur = 'الكل', bal = 0, shop = {};
const isAdmin = () => role === 'admin' || role === 'owner', isOwner = () => role === 'owner';
const val = id => $(id).value.trim();
async function act(p, ok) { const r = await p; if (r.error) { toast(r.error.message); return false } if (ok) toast(ok); await load(); return true }

async function load() {
  const [s, p, c] = await Promise.all([sb.from('settings').select('*').eq('id', 1).maybeSingle(), sb.from('products').select('*').order('created_at', { ascending: false }), sb.from('categories').select('*').order('sort')]);
  cfg = s.data || {}; prods = p.data || []; cats = c.data || [];
  if (me && isAdmin()) {
    const w = await sb.from('wallet_tx').select('amount').eq('user_id', me.id);
    bal = (w.data || []).reduce((a, x) => a + Number(x.amount), 0);
    shop = (await sb.from('profiles').select('shop_name,whatsapp').eq('id', me.id).maybeSingle()).data || {};
  }
  const st = document.documentElement.style;
  if (cfg.primary_color) st.setProperty('--ac', cfg.primary_color);
  if (cfg.bg_color) st.setProperty('--bg', cfg.bg_color);
  render(); renderBar(); await renderAdmin();
}
async function setUser(u) {
  me = u || null; role = 'user';
  if (me) role = (await sb.from('profiles').select('role').eq('id', me.id).maybeSingle()).data?.role || 'user';
  await load();
}

function render() {
  const name = cfg.store_name || 'Kama Store';
  document.title = name; $('sname').textContent = name;
  const names = ['الكل', ...cats.map(c => c.name)];
  $('tabs').innerHTML = names.map(c => `<button class="${c === cur ? 'on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { cur = b.dataset.c; render() });
  const list = prods.filter(p => cur === 'الكل' || p.category === cur);
  $('grid').innerHTML = list.length ? list.map(p => {
    const img = p.image_url ? `<img src="${esc(p.image_url)}" alt="${esc(p.name)}">` : '🛍️';
    const wa = p.whatsapp || cfg.whatsapp;
    const msg = encodeURIComponent('أهلاً، عايز أسأل عن: ' + p.name + ' (' + p.price + ' ج.م)');
    const btn = wa ? `<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(wa)}?text=${msg}">تواصل مع المحل</a>` : '';
    const del = me && (isOwner() || p.seller_id === me.id) ? `<button class="btn sec" data-del="${esc(p.id)}">حذف</button>` : '';
    return `<div class="card"><div class="ph">${img}</div><div class="info"><span class="cat">${esc(p.category)}${p.shop_name ? ' · ' + esc(p.shop_name) : ''}</span><h3>${esc(p.name)}</h3><span class="price">${esc(String(p.price))} ج.م</span>${btn}${del}</div></div>`;
  }).join('') : '<div class="empty">مفيش منتجات في القسم ده لسه</div>';
  $('grid').querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirm('تحذف المنتج؟') && act(sb.from('products').delete().eq('id', b.dataset.del)));
  const l = Object.entries(SOC).filter(([k]) => cfg[k]).map(([k, n]) => `<a href="${esc(cfg[k])}" target="_blank" rel="noopener">${n}</a>`);
  if (cfg.whatsapp) l.push(`<a href="https://wa.me/${esc(cfg.whatsapp)}" target="_blank" rel="noopener">واتساب</a>`);
  if (cfg.email) l.push(`<a href="mailto:${esc(cfg.email)}">إيميل</a>`);
  $('foot').innerHTML = l.length ? `<p>تابعنا على</p><div class="soc">${l.join('')}</div>` : '';
}

function renderBar() {
  const b = $('bar');
  if (me) { b.innerHTML = `<span style="color:var(--mu)">${esc(me.email)} ${role !== 'user' ? '(' + (isOwner() ? 'مالك' : 'أدمن') + ')' : ''}</span><button id="lo">خروج</button>`; $('lo').onclick = () => sb.auth.signOut() }
  else { b.innerHTML = `<button id="li">تسجيل الدخول</button><button id="su">حساب جديد</button>`; $('li').onclick = () => authBox('login'); $('su').onclick = () => authBox('signup') }
}
function authBox(mode) {
  const a = $('auth'); a.hidden = false;
  a.innerHTML = `<h2>${mode === 'login' ? 'تسجيل الدخول' : 'إنشاء حساب جديد'}</h2><div class="row"><input id="ae" type="email" placeholder="الإيميل" dir="ltr"><input id="ap" type="password" placeholder="الباسورد (6 حروف على الأقل)" dir="ltr"><button class="btn" id="ago" type="button">${mode === 'login' ? 'دخول' : 'إنشاء الحساب'}</button></div>`;
  $('ago').onclick = async () => {
    const c = { email: val('ae'), password: $('ap').value };
    const { error } = mode === 'login' ? await sb.auth.signInWithPassword(c) : await sb.auth.signUp(c);
    if (error) return toast(error.message);
    a.hidden = true; toast(mode === 'login' ? 'تم الدخول' : 'تم إنشاء الحساب');
  };
}

async function renderAdmin() {
  const a = $('admin'); a.hidden = !isAdmin();
  if (!isAdmin()) { a.innerHTML = ''; return }
  a.innerHTML = `<h2>لوحة التحكم</h2>
  <div class="row"><b>رصيدك: ${bal} ج.م</b><span>رسوم نشر المنتج: ${cfg.listing_fee ?? 0} ج.م</span></div>
  <hr><h3>بيانات محلك (بتظهر على منتجاتك)</h3>
  <div class="row"><input id="shn" placeholder="اسم المحل" value="${esc(shop.shop_name)}"><input id="shw" placeholder="واتساب المحل 201xxxxxxxxx" dir="ltr" value="${esc(shop.whatsapp)}"><button class="btn" data-a="shop" type="button">حفظ</button></div>
  <hr><h3>إضافة منتج</h3>
  <form id="f"><input id="fn" placeholder="اسم المنتج" required><input id="fp" type="number" min="0" placeholder="السعر" required><select id="fc">${cats.map(c => `<option>${esc(c.name)}</option>`).join('')}</select><input id="ff" type="file" accept="image/*"><button class="btn" type="submit">نشر المنتج</button></form>
  <hr><h3>سحب الرصيد</h3>
  <div class="row"><input id="wa" type="number" min="1" placeholder="المبلغ"><select id="wm"><option>إنستا باي</option><option>فودافون كاش</option><option>محفظة إلكترونية أخرى</option></select><input id="wn" placeholder="رقم الحساب أو المحفظة" dir="ltr"><button class="btn" data-a="wd" type="button">طلب سحب</button></div>
  ${isOwner() ? '<div id="own"></div>' : ''}`;
  $('f').onsubmit = async e => {
    e.preventDefault(); let img = ''; const file = $('ff').files[0];
    if (file) {
      const path = Date.now() + '.' + (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
      const up = await sb.storage.from('products').upload(path, file);
      if (up.error) return toast(up.error.message);
      img = sb.storage.from('products').getPublicUrl(path).data.publicUrl;
    }
    act(sb.rpc('publish_product', { p_name: val('fn'), p_price: Number(val('fp')), p_cat: $('fc').value, p_img: img }), 'تم نشر المنتج');
  };
  if (isOwner()) renderOwner();
}

async function renderOwner() {
  const [u, w, t] = await Promise.all([sb.from('profiles').select('*').order('email'), sb.from('withdrawals').select('*').eq('status', 'pending').order('created_at'), sb.from('wallet_tx').select('amount').eq('kind', 'listing_fee')]);
  const comm = -(t.data || []).reduce((s, x) => s + Number(x.amount), 0);
  $('own').innerHTML = `<hr><h2>أدوات المالك</h2><p><b>إجمالي عمولاتك: ${comm} ج.م</b></p>
  <h3>الشكل والإعدادات</h3>
  <div class="row"><input id="cn" placeholder="اسم المتجر" value="${esc(cfg.store_name)}"><input id="cw" placeholder="واتساب المتجر" dir="ltr" value="${esc(cfg.whatsapp)}"><input id="ce" placeholder="الإيميل" dir="ltr" value="${esc(cfg.email)}"><input id="cf" type="number" min="0" placeholder="رسوم نشر المنتج" value="${cfg.listing_fee ?? 0}"></div>
  <div class="row" style="margin-top:8px"><label>اللون الأساسي <input id="cp" type="color" value="${cfg.primary_color || '#b4532a'}"></label><label>لون الخلفية <input id="cb" type="color" value="${cfg.bg_color || '#faf7f2'}"></label></div>
  <div class="row" style="margin-top:8px">${Object.keys(SOC).map(k => `<input id="so_${k}" placeholder="رابط ${SOC[k]}" dir="ltr" value="${esc(cfg[k])}">`).join('')}</div>
  <button class="btn" data-a="cfg" type="button" style="margin-top:8px">حفظ الإعدادات</button>
  <hr><h3>الأقسام</h3><div class="row">${cats.map(c => `<button class="btn sec" style="margin:0" data-a="catdel" data-id="${esc(c.id)}">${esc(c.name)} ✕</button>`).join('')}</div>
  <div class="row" style="margin-top:8px"><input id="nc" placeholder="اسم قسم جديد"><button class="btn" data-a="catadd" type="button">إضافة قسم</button></div>
  <hr><h3>شحن رصيد محل (بعد ما يدفعلك)</h3>
  <div class="row"><input id="ke" placeholder="إيميل المحل" dir="ltr"><input id="ka" type="number" placeholder="المبلغ"><button class="btn" data-a="credit" type="button">شحن</button></div>
  <hr><h3>طلبات السحب المعلقة</h3>
  ${(w.data || []).map(x => `<div class="row" style="align-items:center;margin-bottom:6px"><span dir="ltr">${esc(x.email)}</span><span>${x.amount} ج.م · ${esc(x.method)} · <span dir="ltr">${esc(x.account)}</span></span><span><button class="btn" style="display:inline-block;margin:0 4px" data-a="wdok" data-id="${esc(x.id)}">تم التحويل</button><button class="btn sec" style="display:inline-block;margin:0" data-a="wdno" data-id="${esc(x.id)}">رفض</button></span></div>`).join('') || '<div class="empty">لا يوجد</div>'}
  <hr><h3>المستخدمين والأدمنز</h3>
  ${(u.data || []).map(x => `<div class="row" style="align-items:center;margin-bottom:6px"><span dir="ltr">${esc(x.email)}</span><span>${x.role === 'owner' ? 'مالك' : x.role === 'admin' ? 'أدمن (محل)' : 'مستخدم'}</span>${x.role === 'owner' ? '<span></span>' : `<button class="btn sec" style="margin:0" data-a="role" data-id="${esc(x.id)}" data-r="${x.role === 'admin' ? 'user' : 'admin'}">${x.role === 'admin' ? 'شيل الأدمن' : 'اجعله أدمن'}</button>`}</div>`).join('')}`;
}

$('admin').onclick = e => {
  const b = e.target.closest('[data-a]'); if (!b) return; const d = b.dataset;
  if (d.a === 'shop') act(sb.rpc('set_shop', { p_name: val('shn'), p_wa: val('shw') }), 'تم الحفظ');
  if (d.a === 'wd') act(sb.rpc('request_withdraw', { p_amount: Number(val('wa')), p_method: $('wm').value, p_account: val('wn') }), 'تم إرسال طلب السحب');
  if (d.a === 'cfg') { const row = { store_name: val('cn'), whatsapp: val('cw').replace(/\D/g, ''), email: val('ce'), listing_fee: Number(val('cf')), primary_color: $('cp').value, bg_color: $('cb').value }; Object.keys(SOC).forEach(k => row[k] = normUrl(val('so_' + k))); act(sb.from('settings').update(row).eq('id', 1), 'تم الحفظ') }
  if (d.a === 'catadd' && val('nc')) act(sb.from('categories').insert({ name: val('nc'), sort: cats.length + 1 }), 'تمت الإضافة');
  if (d.a === 'catdel' && confirm('تحذف القسم؟')) act(sb.from('categories').delete().eq('id', d.id));
  if (d.a === 'credit') act(sb.rpc('owner_credit', { p_email: val('ke'), p_amount: Number(val('ka')), p_note: 'شحن رصيد' }), 'تم الشحن');
  if (d.a === 'wdok') act(sb.rpc('mark_withdrawal', { p_id: d.id, p_status: 'paid' }), 'تم');
  if (d.a === 'wdno') act(sb.rpc('mark_withdrawal', { p_id: d.id, p_status: 'rejected' }), 'تم الرفض ورجوع الرصيد');
  if (d.a === 'role') act(sb.from('profiles').update({ role: d.r }).eq('id', d.id), 'تم التعديل');
};

(async () => {
  const { data: { session } } = await sb.auth.getSession(); await setUser(session?.user);
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_IN' || ev === 'SIGNED_OUT') sb.auth.getSession().then(r => setUser(r.data.session?.user)) });
})();
</script>
</body>
</html>
